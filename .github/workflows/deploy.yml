name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.vars.outputs.build_id }}
      commit_hash: ${{ steps.vars.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate build ID
        id: vars
        run: |
          echo "build_id=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build
        id: build
        run: |
          npm run build 2>&1 | tee /tmp/build.log
          exit_code=${PIPESTATUS[0]}
          echo "$exit_code" > /tmp/build_exit_code
          if [ $exit_code -ne 0 ]; then
            echo "::warning::Build failed with exit code $exit_code"
          fi
          exit $exit_code
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'Ahram Distribution' }}
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION || '1.0.0' }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          BUILD_ID: ${{ steps.vars.outputs.build_id }}
          COMMIT_HASH: ${{ steps.vars.outputs.commit_hash }}
          NODE_OPTIONS: "--no-warnings"

      - name: Report build errors
        if: always()
        run: |
          ec=$(cat /tmp/build_exit_code 2>/dev/null || echo "unknown")
          if [ "$ec" = "0" ]; then
            echo "Build succeeded — build_id: ${{ steps.vars.outputs.build_id }}"
            echo "Manifest:"
            cat dist/build-manifest.json 2>/dev/null || echo "(no manifest)"
            exit 0
          fi
          echo "::warning::Build failed with exit code $ec"
          echo "::group::Last 40 lines of build output"
          tail -40 /tmp/build.log 2>/dev/null || echo "No build.log found"
          echo "::endgroup::"
          echo "::group::Error lines (grep)"
          grep -n -i -E 'error|fail' /tmp/build.log 2>/dev/null || echo "(no error keywords found)"
          echo "::endgroup::"

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          cp -r dist/* deploy/
          cp deploy/index.html deploy/404.html
          touch deploy/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment (build-manifest + bundle)
        run: |
          expected="${{ needs.build.outputs.build_id }}"
          commit="${{ needs.build.outputs.commit_hash }}"
          base_url="${{ steps.deployment.outputs.page_url }}"
          manifest_url="${base_url}build-manifest.json"
          echo "=== DEPLOYMENT VERIFICATION ==="
          echo "Expected build_id: $expected"
          echo "Commit:            $commit"
          echo "Base URL:          $base_url"
          echo ""
          matched=0
          for i in $(seq 1 30); do
            http_status=$(curl -s -o /tmp/manifest.json -w "%{http_code}" "$manifest_url" 2>/dev/null || echo "000")
            if [ "$http_status" = "200" ]; then
              actual=$(grep '"build_id"' /tmp/manifest.json | head -n 1 | sed -E 's/.*"build_id" *: *"([^"]+)".*/\1/')
              if [ "$actual" = "$expected" ]; then
                matched=1
                echo "✓ build-manifest.json serves expected build_id ($expected)"
                echo "Manifest content:"
                cat /tmp/manifest.json
                break
              fi
              echo "⏳ build_id=$actual (expected $expected) — attempt $i/30"
            else
              echo "⏳ build-manifest.json HTTP $http_status — attempt $i/30"
            fi
            sleep 20
          done
          if [ "$matched" != "1" ]; then
            echo "::error::Deployment verification failed — production did not serve build_id $expected"
            exit 1
          fi
          echo ""
          echo "=== BROWSER BUILD ID VERIFICATION ==="
          html=$(curl -s "${base_url}index.html" 2>/dev/null || echo "")
          main_js=$(echo "$html" | grep -oE '/store/assets/index-[A-Za-z0-9_.-]+\.js' | head -n 1)
          if [ -n "$main_js" ]; then
            js_url="${base_url}${main_js#/store/}"
            if curl -s "$js_url" | grep -qF "$expected"; then
              echo "✓ Main bundle ($main_js) embeds build_id $expected"
            else
              echo "::error::Main bundle does not embed expected build_id ($expected)"
              exit 1
            fi
          else
            echo "::error::Could not locate main bundle in index.html"
            exit 1
          fi
